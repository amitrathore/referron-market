<script>
/* ══════════════════════════════════════════════════════════════════
   Referron Market — client. No framework, no build step.
   Wired to /ui/public-state, /session, /public/touch,
   /coseller/claim-visitor.
   ══════════════════════════════════════════════════════════════════ */
const S={state:null,session:null,seats:[],seatError:null,coseller:null,cosellerError:null,contributorError:null,sellerAgreement:null,sellerAcceptance:null,sellerAgreementError:null,operatorApplications:null,operatorError:null,loading:true,error:null};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seatToken=null, seatTokenError='', seatTokenBusy=false, seatTokenVisible=false;
let seatTokenTimer=null, seatTokenRequestId=0;
function clearSeatToken(){
  seatTokenRequestId++;
  if(seatTokenTimer) clearTimeout(seatTokenTimer);
  seatTokenTimer=null; seatToken=null; seatTokenError='';
  seatTokenBusy=false; seatTokenVisible=false;
}

/* ── theme ── */
const THEME_KEY='referron.theme';
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'light';
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.documentElement.style.colorScheme=next;
  document.querySelector('meta[name="theme-color"]').content=next==='dark'?'#19191d':'#f5f5f7';
  try{localStorage.setItem(THEME_KEY,next);}catch(_){}
  const button=document.querySelector('.theme-toggle');
  button.title=button.ariaLabel=next==='dark'?'Switch to light theme':'Switch to dark theme';
  button.querySelector('img').src='/assets/brand/'+(next==='dark'?'sun':'moon')+'.svg';
}

/* ── attribution ────────────────────────────────────────────────
   Every URL here is a coseller surface once it carries ?ref=.
   Two things are load-bearing:
   1. the ref is stashed in localStorage as well as the GM cookie,
      because signing in is a FULL navigation to the auth app that
      destroys page state — the bug that silently cost every
      conversion on the-js.
   2. first touch wins; a later ref must not overwrite an earlier one. */
const REF_KEY='referron.ref', REF_TTL=30*24*60*60*1000, CLAIMED='referron.claimed';
function stashRef(){
  const t=new URLSearchParams(location.search).get('ref');
  if(!t) return;
  try{
    const prior=JSON.parse(localStorage.getItem(REF_KEY)||'null');
    if(prior && Date.now()-prior.at < REF_TTL) return;
    localStorage.setItem(REF_KEY,JSON.stringify({token:t,at:Date.now()}));
  }catch(e){}
}
async function fireTouch(){
  const t=new URLSearchParams(location.search).get('ref');
  if(!t) return;
  try{
    await fetch('/public/touch',{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:t,path:location.pathname})});
  }catch(e){/* best-effort; never block the read */}
}
async function claimIfNeeded(){
  if(!S.session?.authenticated || localStorage.getItem(CLAIMED)==='1') return;
  try{
    const r=await fetch('/coseller/claim-visitor',{method:'POST',credentials:'include',headers:auth()});
    if(r.ok) localStorage.setItem(CLAIMED,'1');
  }catch(e){}
}
const SEAT_KEY='referron.selected-seat';
function storedSeat(){try{return localStorage.getItem(SEAT_KEY)||'';}catch(e){return '';}}
function auth(){
  const t=localStorage.getItem('referron.token'), seat=storedSeat();
  return {...(t?{'Authorization':'Bearer '+t}:{}),...(t&&seat?{'x-selected-seat':seat}:{})};
}

/* ── data ── */
async function load(){
  try{
    const r=await fetch('/ui/public-state',{credentials:'include',headers:auth()});
    if(!r.ok) throw new Error('state '+r.status);
    S.state=await r.json();
  }catch(e){S.error=e.message;}
  try{
    const r=await fetch('/session',{credentials:'include',headers:auth()});
    if(r.ok) S.session=await r.json();
  }catch(e){}
  if(seatToken && (!S.session?.authenticated ||
                   S.session?.selectedSeat?.playerName!==seatToken.playerName)) clearSeatToken();
  S.seats=[]; S.seatError=null;
  if(S.session?.authenticated && S.session.seatCount>0){
    try{
      const r=await fetch('/seats',{credentials:'include',headers:auth()});
      if(!r.ok) throw new Error('seats '+r.status);
      const body=await r.json();
      if(!Array.isArray(body.seats)) throw new Error('Invalid seat list');
      S.seats=body.seats;
      if(storedSeat()&&!S.seats.some(seat=>seat.playerName===storedSeat()))
        localStorage.removeItem(SEAT_KEY);
    }catch(e){S.seatError=e.message;}
  }
  /* /auth.json is the CONFIG the hosted auth app consumes, not a page. The
     Sign in button linked straight at it, so clicking it showed the raw JSON
     document instead of signing anyone in. The app lives at auth_base_url and
     wants the config as a query param — see mom/auth-ui App.jsx, which errors
     with "Missing config URL. Provide ?config=<url>." */
  try{
    const r=await fetch('/auth.json',{credentials:'omit'});
    if(r.ok) S.authcfg=await r.json();
  }catch(e){}
  S.loading=false;
}
const seatRoles=()=>S.session?.selectedSeat?.playerRoles||
  (S.session?.selectedSeat?.playerRole?[S.session.selectedSeat.playerRole]:[]);
const hasRole=role=>seatRoles().includes(role);
async function loadCoseller(){
  S.coseller=null; S.cosellerError=null;
  if(!seated()||!hasRole('coseller')) return;
  try{
    const r=await fetch('/api/coseller/program',{credentials:'include',headers:auth()});
    const body=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(body?.error?.message||body?.error||('program '+r.status));
    S.coseller=body;
  }catch(e){S.cosellerError=e.message;}
}
async function loadSellerAgreement(){
  S.sellerAgreementError=null;
  try{
    const r=await fetch('/api/seller/agreement',{credentials:'include'});
    const body=await r.json();
    if(!r.ok) throw new Error('Agreement unavailable. Please try again later.');
    S.sellerAgreement=body;
  }catch(e){S.sellerAgreementError=e.message;}
  S.sellerAcceptance=null;
  S.commercial=null;S.commercialError=null;
  if(!seated()) return;
  try{
    const r=await fetch('/api/seller/agreement/status',{credentials:'include',headers:auth()});
    if(r.ok) S.sellerAcceptance=(await r.json()).acceptance||null;
  }catch(e){}
  await loadCommercialSchedule();
}
async function loadOperatorApplications(){
  if(!hasRole('operator')) return;
  S.operatorError=null;
  try{
    const r=await fetch('/api/operator/sellers',{credentials:'include',headers:auth()});
    const body=await r.json();
    if(!r.ok) throw new Error(body.error?.message||'Seller applications unavailable.');
    S.operatorApplications=body.applications||[];
  }catch(e){S.operatorError=e.message;}
}

/* Empty when the config has not loaded or carries no auth_base_url, so the
   button renders as disabled rather than navigating somewhere useless. */
function signInUrl(){
  const b=S.authcfg?.auth_base_url;
  if(!b) return '';
  return b.replace(/\/$/,'')+'/?config='+encodeURIComponent(location.origin+'/auth.json');
}

/* Sign-out is the same auth app with ?logout=true: it calls Clerk signOut()
   and then returns here via the config's logout_url. There is no local session
   to clear — the GM holds none, the Clerk session is the session — so doing
   this ourselves would leave the user still signed in at the auth origin and
   silently signed straight back in on the next visit. */
function signOutUrl(){
  const u=signInUrl();
  return u ? u+'&logout=true' : '';
}

/* Clerk's signOut() ends the session at the auth origin; this drops OUR copy
   of the token. Without it the SPA still holds a JWT for a session that no
   longer exists and keeps rendering as signed in until the token expires. */
function dropToken(){
  ShareWidget.close();S.coseller=null;
  clearSeatToken();
  try{localStorage.removeItem('referron.token');localStorage.removeItem(SEAT_KEY);}catch(e){}
}

/* Signed in is not the same as seated. Enrolment no longer happens silently,
   so "authenticated with no seat" is a real, ordinary state and every surface
   that assumed a seat has to say so instead of rendering @undefined. */
const seated=()=>!!S.session?.selectedSeat?.playerName;
const seatChoiceRequired=()=>S.session?.authenticated && !seated() &&
  (S.seats.length>0 || (S.session?.seatCount||0)>0);
async function selectSeat(name){
  if(!S.seats.some(seat=>seat.playerName===name)) return;
  ShareWidget.close(false);
  clearSeatToken();
  try{localStorage.setItem(SEAT_KEY,name);}catch(e){S.seatError='Could not save your seat selection.';render();return;}
  await load();
  await loadCoseller(); await loadMarket(); await loadSellerAgreement(); resumeMarketReturn(); render(); await ShareWidget.resume();
}
async function retrySeats(){await load();await loadMarket();render();}
function seatPicker(){
  if(S.seats.length<2) return '';
  const chosen=S.session?.selectedSeat?.playerName||'';
  return `<label class="seat-switch">Acting as <select aria-label="Player seat" onchange="selectSeat(this.value)">
    <option value="" ${chosen?'':'selected'} disabled>Choose a seat</option>
    ${S.seats.map(seat=>`<option value="${esc(seat.playerName)}" ${seat.playerName===chosen?'selected':''}>@${esc(seat.playerName)}</option>`).join('')}
  </select></label>`;
}
async function generateSeatToken(){
  if(seatTokenBusy||!seated()) return;
  clearSeatToken();
  seatTokenBusy=true;
  const requestId=seatTokenRequestId, playerName=S.session.selectedSeat.playerName;
  render();
  try{
    const r=await fetch('/api/player-token',{method:'POST',credentials:'include',cache:'no-store',headers:auth()});
    const body=await r.json().catch(()=>({}));
    if(requestId!==seatTokenRequestId||S.session?.selectedSeat?.playerName!==playerName) return;
    if(!r.ok||!body.token) throw new Error(body?.error?.message||'Could not create a seat token. Try again.');
    const expiresAt=Number(body.expiresAt);
    if(body.playerName!==playerName||!Number.isFinite(expiresAt)||expiresAt<=Date.now())
      throw new Error('The token response was invalid. Try again.');
    seatToken={value:body.token,playerName,expiresAt};
    seatTokenTimer=setTimeout(()=>{clearSeatToken();if(route().v==='studio') render();},
      Math.min(expiresAt-Date.now(),2147483647));
  }catch(e){
    if(requestId!==seatTokenRequestId) return;
    seatTokenError=e.message;
  }
  seatTokenBusy=false;
  render();
}
async function copySeatToken(){
  if(!seatToken||seatToken.expiresAt<=Date.now()) return;
  try{await navigator.clipboard.writeText(seatToken.value);toast('Seat token copied');}
  catch(e){toast('Could not copy token. Reveal it to copy manually.');}
}
function toggleSeatToken(){seatTokenVisible=!seatTokenVisible;render();}

/* MoM validates the handle and owns uniqueness, so its rejection is shown
   verbatim rather than re-implemented here — a client-side rule that drifts
   from the server's is worse than no rule. */
async function claimHandle(ev,activateAfter=false){
  ev.preventDefault();
  const el=document.getElementById('handle');
  const err=document.getElementById('handle-err');
  const name=(el?.value||'').trim();
  err.textContent='';
  if(!name){ err.textContent='Pick a handle first.'; return; }
  try{
    const r=await fetch('/join/claim',{method:'POST',credentials:'include',
      headers:Object.assign({'Content-Type':'application/json'},auth()),
      /* Audience is the reading seat. Contributor and coseller are claimed
         separately by a player who wants to write or share. */
      body:JSON.stringify({'player-name':name,'roles':['audience']})});
    const body=await r.json().catch(()=>({}));
    if(!r.ok){
      err.textContent = body.message || body.error || ('Could not claim that handle ('+r.status+').');
      return;
    }
    await load();
    if(activateAfter) await activateCoseller();
    else { await loadCoseller(); await loadMarket(); await loadSellerAgreement(); resumeReturn(); resumeMarketReturn(); render(); await ShareWidget.resume(); }
  }catch(e){ err.textContent='Network error — try again.'; }
}
async function activateCoseller({renderPage=true}={}){
  S.cosellerError=null;
  try{
    const r=await fetch('/api/coseller/activate',{method:'POST',credentials:'include',headers:auth()});
    const body=await r.json().catch(()=>({}));
    if(!r.ok||body.error) throw new Error(body?.error?.message||body?.error?.code||body.error||'Activation failed');
    await load(); await loadCoseller(); await loadMarket();
    if(renderPage)render(); toast('Coselling activated — your sharing link is ready');
  }catch(e){S.cosellerError=e.message;if(renderPage)render();}
}
async function becomeContributor(){
  if(!seated()||hasRole('contributor')) return;
  S.contributorError=null;
  try{
    const r=await fetch('/join/claim',{method:'POST',credentials:'include',
      headers:Object.assign({'Content-Type':'application/json'},auth()),
      body:JSON.stringify({'player-name':S.session.selectedSeat.playerName,'roles':['contributor']})});
    const body=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(body.message||body.error||'Could not claim Contributor.');
    await load();
    render();
    toast('Contributor role added to your handle');
  }catch(e){S.contributorError=e.message;render();}
}
async function copyCosellerLink(path='/'){
  const token=myRefToken();
  if(!token){toast('Activate Coselling first');return;}
  const url=ShareWidget.url(path,token);
  try{await navigator.clipboard.writeText(url);toast('Sharing link copied');}
  catch(e){toast('Copy failed');}
}
function rememberReturn(path){try{sessionStorage.setItem('referron.return',path);}catch(e){}}
function resumeReturn(){
  try{
    const path=sessionStorage.getItem('referron.return');
    if(path&&S.session?.authenticated){sessionStorage.removeItem('referron.return');history.replaceState({},'',path);}
  }catch(e){}
}
const gs=()=>S.state?.gameState||{};
/* Newest first. The protocol's feed is append-only — review-task conjs onto
   the end — so the raw vector is oldest-first, which buries the newest essay
   under everything before it. Sorted here rather than in the GM so the stored
   order stays the publication record.

   slice() first: sort mutates, and this array is the live state object shared
   with every other view. */
const feed=()=>(gs().attention?.feed||[])
  .slice()
  .sort((a,b)=>(b?.['published-at']||0)-(a?.['published-at']||0));
const bible=()=>gs().attention?.['brand-bible']||{};
const caps=()=>Object.values(gs().market?.capabilities||{});
const topics=()=>S.state?.topics||[];
const myRefToken=()=>ShareWidget.token();
const slugOf=it=>it?.slug||it?.payload?.slug||it?.id;
/* Match on slug OR id. The first post was published before slugs existed and
   its UUID URL is already shared; resolving only by slug would 404 it the
   moment anything gained one. This also makes a later backfill non-breaking. */
const findPost=key=>feed().find(x=>String(slugOf(x))===String(key)
                                 || String(x?.id)===String(key));
const titleOf=it=>it?.payload?.title||'Untitled';

/* ── routing ── */
function route(){
  const p=location.pathname;
  if(p==='/'||p==='') return {v:'home'};
  if(p==='/insights') return {v:'essays'};
  if(p==='/manifesto') return {v:'manifesto'};
  if(p==='/join') return {v:'join'};
  if(p==='/earnings') return {v:'earnings'};
  if(p==='/coselling') return {v:'coselling'};
  if(p==='/studio') return {v:'studio'};
  if(p==='/market') return {v:'market'};
  const marketMatch=p.match(/^\/market\/([^/]+)(?:\/products\/([^/]+))?$/);
  if(marketMatch) return {v:'market',seller:decodeURIComponent(marketMatch[1]),product:marketMatch[2]&&decodeURIComponent(marketMatch[2])};
  if(p==='/privacy') return {v:'privacy'};
  if(p==='/terms') return {v:'terms'};
  if(p==='/seller-agreement') return {v:'seller-agreement'};
  if(p==='/operator/discoverability') return {v:'operator-discoverability'};
  if(p.startsWith('/guides/')) return {v:'guide'};
  if(p==='/operator/sellers') return {v:'operator-sellers'};
  if(p.startsWith('/insights/')) return {v:'essay',slug:decodeURIComponent(p.slice(10))};
  if(p.startsWith('/topics/')) return {v:'topic',topic:decodeURIComponent(p.slice(8))};
  if(p.startsWith('/@')) return {v:'person',name:decodeURIComponent(p.slice(2))};
  return {v:'missing'};
}
function go(href,e){if(e)e.preventDefault();ShareWidget.close(false);if(Market.embedded){Market.embedded.destroy();Market.embedded=null;}if(href!=='/studio')clearSeatToken();history.pushState({},'',href);render();if(route().v==='seller-agreement'&&!S.sellerAgreement)loadSellerAgreement().then(render);if(route().v==='operator-sellers')loadOperatorApplications().then(render);if(route().v==='operator-discoverability')loadDiscovery().then(render);scrollTo(0,0);}
addEventListener('popstate',()=>{Market.embedded?.destroy();Market.embedded=null;if(route().v!=='studio')clearSeatToken();render();if(route().v==='seller-agreement'&&!S.sellerAgreement)loadSellerAgreement().then(render);if(route().v==='operator-sellers')loadOperatorApplications().then(render);if(route().v==='operator-discoverability')loadDiscovery().then(render);});
document.addEventListener('click',e=>{
  const choice=e.target.closest('[data-choose-seat]');
  if(choice){selectSeat(choice.dataset.chooseSeat);return;}
  const a=e.target.closest('a[data-nav]');
  if(a&&a.origin===location.origin) go(a.getAttribute('href'),e);
});

/* ── share: one button, no affiliate vocabulary anywhere ── */
async function share(){
  const tok=myRefToken();
  const url=ShareWidget.url(location.pathname,tok);
  try{await navigator.clipboard.writeText(url.toString());
      toast(tok?'Link copied — it carries your name':'Link copied');}
  catch(e){toast('Copy failed');}
}
let toastT;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}

/* ── views ── */
function connectNotice(){
  const p=new URLSearchParams(location.search), result=p.get('connect');
  if(result==='return') return '<div class="connect-notice" role="status">Stripe account connected. <a href="/market" data-nav>Return to the market</a>.</div>';
  if(result!=='error') return '';
  const reasons={
    'stripe-authorization-denied':'Stripe did not authorize the connection.',
    'invalid-state':'The connection link was invalid or changed. Start a new connection from your seller page.',
    'missing-code':'Stripe did not return an authorization code. Start a new connection.',
    'configuration-unavailable':'The connection is temporarily unavailable.',
    'attempt-unavailable':'This connection attempt expired or was already used. Start a new connection.',
    'attempt-mismatch':'The connection attempt did not match your seller.',
    'oauth-invalid-grant':'Stripe rejected the authorization code. Start a new connection from your seller page.',
    'oauth-invalid-client':'Stripe did not recognize the platform connection settings.',
    'oauth-invalid-request':'Stripe rejected the connection request.',
    'oauth-exchange-failed':'Stripe could not complete the authorization exchange.',
    'seller-account-not-ready':'The Stripe account is not yet ready to accept payments and payouts.',
    'account-mismatch':'A different Stripe account was selected. Choose your seller account.',
    'account-save-failed':'The Stripe account was authorized but could not be saved. Contact support before trying again.'
  };
  const reason=p.get('reason');
  return `<div class="connect-notice error" role="alert">${reasons[reason]||'Stripe account connection failed.'} ${reason&&Object.hasOwn(reasons,reason)?`<small>Code: ${reason}</small>`:''}</div>`;
}
function chrome(inner){
  const r=route(), on=v=>r.v===v?'class="on" aria-current="page"':'';
  const me=S.session?.selectedSeat?.playerName;
  const dark=document.documentElement.dataset.theme==='dark';
  return `
  <header><div class="bar">
    <a class="wordmark" href="/" data-nav aria-label="Referron Market home" ${on('home')}><img class="brand-mark" src="/assets/brand/referron-logo.png" width="158" height="40" alt=""><span class="market-word">Market</span></a>
    <nav aria-label="Main navigation">
      <a href="/coselling" data-nav ${on('coselling')}>Refer & earn</a>
      <a href="/seller-agreement" data-nav ${on('seller-agreement')}>Sell with us</a>
      <a href="/market" data-nav ${on('market')}>Market</a>
      <a href="/insights" data-nav ${on('essays')||on('essay')}>Insights</a>
      ${S.session?.authenticated?`<a href="/earnings" data-nav ${on('earnings')}>Earnings</a><a href="/studio" data-nav ${on('studio')}>My account</a>`:''}
      ${!S.session?.authenticated
        ? `<a href="/join" data-nav ${on('join')}>Join</a>`
        : seated()
          ? `<a href="/@${esc(me)}" data-nav>@${esc(me)}</a>`
          : S.seats.length>1

let earningsRequest=0;
async function earningsFetch(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',credentials:'include',headers:{...auth(),'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
  const result=await r.json();if(!r.ok) throw new Error(result.error?.message||result.error?.code||'Earnings are unavailable. Please try again.');return result;
}
async function loadEarnings(){
  const host=document.getElementById('earnings-data');if(!host||!seated())return;
  const request=++earningsRequest;
  try{
    const [walletResult,connect,history]=await Promise.all([earningsFetch('/wallet'),earningsFetch('/api/connect/status'),earningsFetch('/api/wallet/withdrawals')]);
    if(request!==earningsRequest||!host.isConnected)return;
    const wallet=walletResult.wallet, money=n=>fmtPrice(n||0,'usd-cents'), records=history.withdrawals||[];
    host.innerHTML=`<div class="referron-steps"><article><h2>${money(wallet.balance)}</h2><p>Total balance</p></article><article><h2>${money(wallet.availableNow)}</h2><p>Available to withdraw</p></article><article><h2>${money((wallet.pending||[]).reduce((sum,p)=>sum+p.amount,0))}</h2><p>Pending availability</p></article></div>
      <section class="sec"><h2>Payout account</h2><p>${connect.maskedExternalId?esc(connect.maskedExternalId)+' · ':''}${esc(connect.status||'Not connected')}</p>
      ${!connect.connectEnabled?'<p>Withdrawals will open after payment setup is complete.</p>':connect.payoutsEnabled?`<form onsubmit="withdrawEarnings(event)"><label for="withdraw-amount">Amount in USD</label><input id="withdraw-amount" type="number" min="0.01" max="${(wallet.availableNow/100).toFixed(2)}" step="0.01" required><button class="btn fill" type="submit" ${wallet.availableNow>0?'':'disabled'}>Withdraw</button></form>`:'<button class="btn" onclick="onboardEarnings()">Set up payouts</button>'}</section>
      <section class="sec"><h2>Withdrawal history</h2>${records.length?records.map(w=>`<p>${money(w.amount)} · ${esc(w.status)} <small>${esc(w.id)}</small></p>`).join(''):'<p>No withdrawals yet.</p>'}</section><p id="earnings-message" role="status"></p>`;
  }catch(e){if(host.isConnected)host.innerHTML=`<p role="alert">${esc(e.message)}</p><button class="btn" onclick="loadEarnings()">Try again</button>`;}
}
async function onboardEarnings(){
  try{const result=await earningsFetch('/api/connect/onboard',{'return-path':'/earnings'});const url=new URL(result.url);if(url.protocol!=='https:'||!url.hostname.endsWith('.stripe.com'))throw new Error('Invalid payout setup link');location.assign(url.href);}catch(e){toast(e.message);}
}
async function withdrawEarnings(event){
  event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;
  const amount=Math.round(Number(document.getElementById('withdraw-amount').value)*100);
  const key='referron.withdrawal.'+S.session.selectedSeat.playerName;let attempt;
  try{attempt=JSON.parse(localStorage.getItem(key)||'null');if(!attempt||attempt.amount!==amount){attempt={amount,withdrawalId:crypto.randomUUID()};localStorage.setItem(key,JSON.stringify(attempt));}
    const result=await earningsFetch('/api/wallet/withdraw',attempt);
    if(['paid','settling','rejected'].includes(result.status))localStorage.removeItem(key);
    toast(result.status==='paid'?'Withdrawal sent':'Withdrawal '+result.status);await loadEarnings();
  }catch(e){toast(e.message+' Retry the same amount to resume this withdrawal.');button.disabled=false;}
}

      publish and the name your share links carry. It is <b>permanent</b>: it is the key our
      systems use to attribute your writing, your sales and your earnings, so it cannot be
      changed after it is claimed.</p>
    <p>We store what you publish, what you list for sale, your orders, and the referral
      relationships that determine who is paid for a sale.</p>

    <h2>Readers who have not signed in</h2>
    <p>If you arrive through someone's share link we set a cookie holding an anonymous visitor
      identifier so that person can be credited if you later buy something. It contains no
      personal information. If you sign in, those visits are re-keyed to your handle; if you
      never do, the identifier expires and nothing is ever attached to a person.</p>

    <h2>How we use it</h2>
    <p>To authenticate you, publish what you ask us to publish, process payments and payouts,
      attribute referrals, prevent abuse, and support you.</p>

    <h2>Service providers</h2>
    <p>We rely on third parties for authentication, payment processing and payouts, hosting and
      diagnostics. Payment details are handled by our payment processor and are never stored by
      us.</p>

    <h2>What is public</h2>
    <p>Your handle, the essays you publish, what you list for sale, and your comments are public
      by design. Your email address, your balances and your payout details are not.</p>

    <h2>Retention</h2>
    <p>We keep information while your account is active and afterwards where we must — to settle
      payments, meet legal and tax obligations, resolve disputes and enforce our terms.
      Published essays and completed transactions form a permanent record: they are what other
      people were paid on, so they are not removed on request.</p>

    <h2>Your choices</h2>
    <p>You may request a copy of your information or ask us to close your account. Ask through
      the support channel in the product.</p>

    <h2>Security</h2>
    <p>We use reasonable safeguards. No service can promise complete security, and we will not
      claim otherwise.</p>

    <h2>Changes</h2>
    <p>We will post any changes here with a new effective date.</p>`);
}

async function reviewSeller(ev){
  ev.preventDefault();
  const form=ev.currentTarget, button=ev.submitter;
  if(!button||!form.reportValidity()) return;
  button.disabled=true;
  try{
    const data=Object.fromEntries(new FormData(form));
    data.decision=button.value;
    if(data.decision==='activated') data['configuration-confirmed']=form.elements['configuration-confirmed']?.checked===true;
    const r=await fetch('/api/operator/sellers/review',{method:'POST',credentials:'include',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify(data)});
    const body=await r.json();
    if(!r.ok) throw new Error(body.error?.message||body.error?.code||'Review failed.');
    await loadOperatorApplications(); render(); toast('Seller review saved');
  }catch(e){S.operatorError=e.message;render();}
}
async function acceptSellerAgreement(ev){
  ev.preventDefault();
  const form=ev.currentTarget, button=form.querySelector('button[type="submit"]');
  if(!form.reportValidity()||!S.sellerAgreement) return;
  const data=Object.fromEntries(new FormData(form));
  data.accepted=true;
  data.version=S.sellerAgreement.version;
  data.sha256=S.sellerAgreement.sha256;
  button.disabled=true;
  S.sellerAgreementError=null;
  try{
    const r=await fetch('/api/seller/agreement/accept',{method:'POST',credentials:'include',headers:Object.assign({'Content-Type':'application/json'},auth()),body:JSON.stringify(data)});
    const body=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(body.error?.message||'Could not record your acceptance. Please try again.');
    S.sellerAcceptance=body.acceptance;
    render();
  }catch(e){S.sellerAgreementError=e.message;button.disabled=false;form.querySelector('.seller-accept-error').textContent=e.message;}
}

/* ── capture the session token ───────────────────────────────────
   The auth app finishes by redirecting to success_url with ?token=<jwt>
   appended (see mom/auth-ui completeLogin -> buildRedirect), and the GM's
   /auth/success bounces that query straight through to "/". auth() reads
   localStorage['referron.token'] — but nothing ever WROTE it, so a full,
   successful Clerk login landed home and the SPA still had no credential.
   The page then showed Sign in again, which reads like the login failed
   rather than like the token was dropped on the doorstep.

   set_cookie is false in the config, so there is no cookie to fall back on:
   this query param is the ONLY way the token reaches the browser.

   Stripped from the URL afterwards so a JWT is not left sitting in history,
   or in a link the reader copies out of the address bar. */
function captureToken(){
  const p=new URLSearchParams(location.search);
  const t=p.get('token');
  if(!t) return;
  try{ localStorage.setItem('referron.token',t); }catch(e){}
  p.delete('token'); p.delete('provider');
  const q=p.toString();
  history.replaceState({},'',location.pathname+(q?'?'+q:'')+location.hash);
}

(async function boot(){
  captureToken();
  stashRef(); render(); fireTouch();
  await load(); resumeReturn(); await claimIfNeeded(); await loadCoseller(); await loadMarket();
  if(route().v==='seller-agreement') await loadSellerAgreement();
  if(route().v==='operator-sellers') await loadOperatorApplications();
  if(route().v==='operator-discoverability') await loadDiscovery();
  resumeMarketReturn();
  render(); await ShareWidget.resume();
  if(location.hash==='#commercial-terms') requestAnimationFrame(()=>document.getElementById('commercial-terms')?.scrollIntoView());
})();
</script>
